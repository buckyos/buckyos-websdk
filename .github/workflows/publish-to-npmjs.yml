name: Publish to npmjs

run-name: Publish to npmjs by @${{ github.actor }}

on:
  workflow_dispatch:
  push:
    tags:
      - "publish*"

permissions:
  contents: read

concurrency:
  group: publish-to-npmjs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify publish tag matches package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="publish${package_version}"

          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match package.json version. Expected '${expected_tag}'."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Test SDK
        run: pnpm test --runInBand --testPathIgnorePatterns='tests/app-client/runtime\.unit\.test\.ts|tests/cert\.test\.ts'
      - name: Check CLI
        run: pnpm run check:cli
      - name: Test CLI
        run: pnpm run test:cli
      - name: Test npm tarball
        run: pnpm run test:tarball
      - name: Publish to npmjs
        run: npm publish --tag latest
